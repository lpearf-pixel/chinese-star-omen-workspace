[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-text-core"
version = "0.1.0"
description = "Shared immutable text parsing and evidence matching primitives"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
