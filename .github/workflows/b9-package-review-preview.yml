name: B9 Package Review Preview

on:
  pull_request:
    branches:
      - stable/kaiyuan-v2
    paths:
      - "apps/star-omen/src/video_pipeline/package.py"
      - "apps/star-omen/src/video_pipeline/review.py"
      - "apps/star-omen/src/video_pipeline/subtitle.py"
      - "apps/star-omen/src/video_pipeline/preview.py"
      - "apps/star-omen/src/video_pipeline/capability.py"
      - "apps/star-omen/src/video_pipeline/vertical_package.py"
      - "apps/star-omen/tests/video_pipeline/package_review/**"
      - ".github/workflows/b9-package-review-preview.yml"

permissions:
  contents: read

jobs:
  package-review-312:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/star-omen/pyproject.toml
      - name: Install downstream project
        run: python -m pip install -e apps/star-omen
      - name: Run focused package and review tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/kb-contracts/python:${{ github.workspace }}/packages/kb-text-core/python
        run: |
          set -o pipefail
          : > "$GITHUB_WORKSPACE/b9-package-review-preview.log"
          cd apps/star-omen
          python -m pytest -q tests/video_pipeline/package_review \
            2>&1 | tee "$GITHUB_WORKSPACE/b9-package-review-preview.log"
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b9-package-review-preview-log
          path: b9-package-review-preview.log
          if-no-files-found: error
          retention-days: 14
