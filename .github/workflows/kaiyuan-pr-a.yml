name: Kaiyuan Stable Core

on:
  pull_request:
    branches:
      - "dev-test"
      - "stable/kaiyuan-v2"
    paths:
      - "apps/star-omen/**"
      - "packages/kb-contracts/**"
      - "packages/kb-text-core/**"
      - "corpus/kaiyuan_zhanjing/**"
      - "scripts/audit_kaiyuan_baseline.py"
      - "scripts/audit_kaiyuan_corpus.py"
      - "scripts/audit_kaiyuan_spot_checks.py"
      - "scripts/compare_kaiyuan_volumes.py"
      - "scripts/split_kaiyuan_fulltext.py"
      - "docs/development/**"
      - "AGENTS.md"
      - "Makefile"
      - ".github/workflows/kaiyuan-pr-a.yml"
  push:
    branches:
      - "stable/kaiyuan-v2"
      - "codex/kaiyuan-corpus-retrieval-v2"
      - "codex/kaiyuan-corpus-hardening-v2"
      - "codex/kaiyuan-citable-sync-v2"

jobs:
  text-core-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/kb-text-core/pyproject.toml

      - name: Install text-core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/kb-text-core pytest

      - name: Shared text-core tests
        run: make text-core-test

  downstream-312:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/star-omen/pyproject.toml

      - name: Install downstream project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/star-omen

      - name: Shared contract tests
        run: make contracts-test

      - name: Targeted CText spot-check audit
        run: |
          python scripts/audit_kaiyuan_spot_checks.py \
            --strict \
            --out /tmp/kaiyuan-ctext-spot-check-report.json
          cat /tmp/kaiyuan-ctext-spot-check-report.json

      - name: Downstream tests
        env:
          KB_SEARCH_API_KEY: ""
        run: make downstream-test
