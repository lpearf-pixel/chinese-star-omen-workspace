name: Kaiyuan PR A

on:
  pull_request:
    paths:
      - "apps/star-omen/**"
      - "packages/kb-contracts/**"
      - "packages/kb-text-core/**"
      - "scripts/audit_kaiyuan_corpus.py"
      - "scripts/split_kaiyuan_fulltext.py"
      - "Makefile"
      - ".github/workflows/kaiyuan-pr-a.yml"
  push:
    branches:
      - "codex/kaiyuan-corpus-retrieval-v2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/star-omen/pyproject.toml

      - name: Install downstream project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/star-omen

      - name: Shared contract tests
        run: make contracts-test

      - name: Shared text-core tests
        run: make text-core-test

      - name: Downstream tests
        env:
          KB_SEARCH_API_KEY: ""
        run: make downstream-test
