name: B9 Scientific Provider

on:
  pull_request:
    branches:
      - stable/kaiyuan-v2
    paths:
      - "apps/star-omen/src/video_pipeline/astronomy/**"
      - "apps/star-omen/src/video_pipeline/asterisms/**"
      - "apps/star-omen/data/video_pipeline/scientific_conventions_v1.yaml"
      - "apps/star-omen/data/video_pipeline/asterism_catalog_v1.yaml"
      - "apps/star-omen/tests/video_pipeline/astronomy/**"
      - "apps/star-omen/tests/video_pipeline/asterisms/**"
      - "apps/star-omen/pyproject.toml"
      - ".github/workflows/b9-scientific-provider.yml"

permissions:
  contents: read

jobs:
  scientific-312:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/star-omen/pyproject.toml
      - name: Install downstream project
        run: python -m pip install -e apps/star-omen
      - name: Run focused scientific provider tests
        id: focused
        shell: bash
        run: |
          set -o pipefail
          cd apps/star-omen
          python -m pytest -q \
            tests/video_pipeline/astronomy \
            tests/video_pipeline/asterisms \
            2>&1 | tee "$GITHUB_WORKSPACE/b9-scientific-provider.log"
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b9-scientific-provider-log
          path: b9-scientific-provider.log
          if-no-files-found: error
          retention-days: 14
