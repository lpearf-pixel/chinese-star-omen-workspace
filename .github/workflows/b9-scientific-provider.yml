name: B9 Scientific Provider

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact major-version candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  scientific-312:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/star-omen/pyproject.toml
      - name: Install downstream project
        run: python -m pip install -e apps/star-omen
      - name: Run focused scientific provider tests
        id: focused
        shell: bash
        run: |
          set -o pipefail
          cd apps/star-omen
          python -m pytest -q \
            tests/video_pipeline/astronomy \
            tests/video_pipeline/asterisms \
            2>&1 | tee "$GITHUB_WORKSPACE/b9-scientific-provider.log"
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b9-scientific-provider-log
          path: b9-scientific-provider.log
          if-no-files-found: error
          retention-days: 14
