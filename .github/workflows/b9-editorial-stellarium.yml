name: B9 Editorial Stellarium

on:
  pull_request:
    branches:
      - stable/kaiyuan-v2
    paths:
      - "apps/star-omen/src/video_pipeline/editorial*.py"
      - "apps/star-omen/src/video_pipeline/stellarium.py"
      - "apps/star-omen/data/examples/video/**"
      - "apps/star-omen/data/video_pipeline/templates/**"
      - "apps/star-omen/tests/video_pipeline/editorial/**"
      - ".github/workflows/b9-editorial-stellarium.yml"

permissions:
  contents: read

jobs:
  editorial-312:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/star-omen/pyproject.toml
      - name: Install downstream project
        run: python -m pip install -e apps/star-omen
      - name: Run focused editorial and script tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/kb-contracts/python:${{ github.workspace }}/packages/kb-text-core/python
        run: |
          set -o pipefail
          : > "$GITHUB_WORKSPACE/b9-editorial-stellarium.log"
          cd apps/star-omen
          python -m pytest -q tests/video_pipeline/editorial \
            2>&1 | tee "$GITHUB_WORKSPACE/b9-editorial-stellarium.log"
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b9-editorial-stellarium-log
          path: b9-editorial-stellarium.log
          if-no-files-found: error
          retention-days: 14
