name: Kaiyuan Upstream Runtime

on:
  pull_request:
    branches:
      - "stable/kaiyuan-v2"
    paths:
      - "apps/local-kb-unified/**"
      - "apps/star-omen/**"
      - "packages/kb-contracts/**"
      - "packages/kb-text-core/**"
      - "corpus/kaiyuan_zhanjing/**"
      - "scripts/**"
      - "docs/development/**"
      - "AGENTS.md"
      - ".env.workspace"
      - ".env.workspace.example"
      - ".gitignore"
      - ".github/workflows/kaiyuan-upstream-runtime.yml"
      - "Makefile"
  push:
    branches:
      - "codex/kaiyuan-upstream-runtime-v2"
      - "codex/kaiyuan-passage-ingest-v2"
      - "codex/kaiyuan-retrieval-contract-v2"
      - "codex/kaiyuan-citable-sync-v2"
      - "stable/kaiyuan-v2"

jobs:
  upstream-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/local-kb-unified/kb-search/requirements.txt
            apps/local-kb-unified/index-jobs/requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r apps/local-kb-unified/kb-search/requirements.txt
          python -m pip install -r apps/local-kb-unified/index-jobs/requirements.txt

      - name: Upstream unit tests
        run: make upstream-test

      - name: Validate Docker Compose configuration
        working-directory: apps/local-kb-unified
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Reject machine-local and secret artifacts
        run: |
          test ! -e .env.workspace
          if find apps/local-kb-unified -type f \( \
            -name '.env' -o \
            -name '.DS_Store' -o \
            -name '*.gguf' -o \
            -name '*.safetensors' \
          \) -print | grep -q .; then
            echo 'forbidden runtime artifact found' >&2
            exit 1
          fi
          if grep -R -n --exclude='.env.example' '/Users/' apps/local-kb-unified; then
            echo 'machine-local absolute path found' >&2
            exit 1
          fi

  qdrant-incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/local-kb-unified/index-jobs/requirements.txt

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r apps/local-kb-unified/index-jobs/requirements.txt

      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Qdrant did not become healthy' >&2
          exit 1

      - name: Incremental reconciliation integration
        env:
          RUN_QDRANT_INTEGRATION: "1"
          QDRANT_URL: http://127.0.0.1:6333
        run: |
          PYTHONPATH=packages/kb-text-core/python \
          pytest -q apps/local-kb-unified/tests/test_qdrant_incremental_integration.py

  qdrant-retrieval-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/local-kb-unified/kb-search/requirements.txt

      - name: Install retrieval integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r apps/local-kb-unified/kb-search/requirements.txt

      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Qdrant did not become healthy' >&2
          exit 1

      - name: Retrieval stage and error semantics integration
        env:
          RUN_QDRANT_RETRIEVAL_INTEGRATION: "1"
          QDRANT_URL: http://127.0.0.1:6333
        run: |
          pytest -q apps/local-kb-unified/tests/test_qdrant_retrieval_contract_v2.py

  candidate-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/star-omen/pyproject.toml
            apps/local-kb-unified/kb-search/requirements.txt
            apps/local-kb-unified/index-jobs/requirements.txt

      - name: Install roundtrip dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e apps/star-omen
          python -m pip install -r apps/local-kb-unified/kb-search/requirements.txt
          python -m pip install -r apps/local-kb-unified/index-jobs/requirements.txt

      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Qdrant did not become healthy' >&2
          exit 1

      - name: Candidate promote ingest retrieve sync roundtrip
        env:
          RUN_CANDIDATE_ROUNDTRIP: "1"
          QDRANT_URL: http://127.0.0.1:6333
          KB_SEARCH_API_KEY: roundtrip-key
        run: |
          PYTHONPATH=packages/kb-contracts/python:packages/kb-text-core/python \
          pytest -q apps/local-kb-unified/tests/test_candidate_roundtrip_v2.py

  workspace-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/star-omen/pyproject.toml

      - name: Install downstream project
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -e apps/star-omen --quiet

      - name: Shared contracts
        run: make contracts-test

      - name: Shared text core
        run: make text-core-test

      - name: Downstream regression
        id: downstream-regression
        continue-on-error: true
        env:
          KB_SEARCH_API_KEY: ""
        run: |
          set -o pipefail
          make downstream-test 2>&1 | tee downstream-test.log

      - name: Upload downstream regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-test-log-${{ github.run_id }}
          path: downstream-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when downstream regression failed
        if: steps.downstream-regression.outcome == 'failure'
        run: exit 1
