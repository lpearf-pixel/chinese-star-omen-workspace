name: Development Governance

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact major-version candidate commit SHA
        required: true
        type: string
      base_sha:
        description: Verified current stable/kaiyuan-v2 commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit test governance checker
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Require task or work-log update for code changes
        run: |
          python scripts/check_development_governance.py \
            --base "${{ inputs.base_sha }}" \
            --head "${{ inputs.candidate_sha }}"
